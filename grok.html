<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eBay Market Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow:wght@300;400;500;600;700;900&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg:#05080f; --bg2:#090d18; --panel:#0d1220; --panel2:#111827;
      --border:#1a2540; --border2:#243050;
      --blue:#2563eb; --blue-b:#3b82f6; --blue-dim:rgba(37,99,235,0.12);
      --cyan:#06b6d4; --cyan-dim:rgba(6,182,212,0.1);
      --green:#10b981; --green-dim:rgba(16,185,129,0.1);
      --red:#ef4444; --red-dim:rgba(239,68,68,0.1);
      --amber:#f59e0b; --amber-dim:rgba(245,158,11,0.1);
      --text:#94a3b8; --text2:#cbd5e1; --bright:#f1f5f9;
      --mono:'Space Mono',monospace; --sans:'Barlow',sans-serif; --cond:'Barlow Condensed',sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:var(--sans);background:var(--bg);color:var(--text2);min-height:100vh;overflow-x:hidden}

    /* ... (весь предыдущий CSS остаётся без изменений) ... */
    .topbar{position:sticky;top:0;z-index:100;background:rgba(5,8,15,0.94);backdrop-filter:blur(14px);
      border-bottom:1px solid var(--border);padding:0 24px;height:54px;
      display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:10px}
    .brand-hex{width:30px;height:30px;background:var(--blue);
      clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
      display:grid;place-items:center;font-size:13px}
    .brand-name{font-family:var(--cond);font-weight:900;font-size:17px;letter-spacing:2px;
      text-transform:uppercase;color:var(--bright)}
    .brand-name span{color:var(--blue-b)}

    .export-btn{background:var(--green);color:white;margin-left:8px;}
    .export-btn:hover{background:#10b981;}
  </style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-hex">⬡</div>
    <div class="brand-name">eBay <span>Analyzer</span></div>
  </div>
  <div class="topbar-right">
    <span class="last-upd" id="lastUpd">—</span>
    <button class="btn btn-ghost btn-sm export-btn" onclick="exportToExcel()" style="margin-left:12px;">
      📊 Экспорт в Excel
    </button>
  </div>
</div>

<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <div class="sb-section">
      <div class="sb-title">🔑 Авторизация</div>
      <div class="field">
        <label>GitHub Token</label>
        <div class="inp-wrap">
          <input type="password" id="tokenInput" placeholder="ghp_...">
          <button class="eye" onclick="toggleToken()">👁</button>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="saveToken()">Сохранить токен</button>
      <div id="tokenStatus"></div>
    </div>

    <div class="sb-section">
      <div class="sb-title">🚀 Запуск</div>
      <div class="field">
        <label>Ключевое слово</label>
        <input type="text" id="kwInput" placeholder="vintage camera">
      </div>
      <div id="kwStatus"></div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
        <button class="btn btn-primary" id="runBtn" onclick="runScraper()">
          <span class="spinner"></span><span class="btn-lbl">▶ Запустить сбор</span>
        </button>
        <button class="btn btn-ghost btn-sm" onclick="loadData()">⟳ Обновить данные</button>
      </div>
      <div id="runStatus"></div>
      <div class="poll-bar" id="pollBar"><div class="poll-spin"></div><span id="pollMsg">Ожидание...</span></div>
      <div id="stepsWrap" style="display:none">
        <div style="height:1px;background:var(--border);margin:12px 0"></div>
        <div class="sb-title">Прогресс</div>
        <div class="steps" id="steps"></div>
      </div>
    </div>

    <div class="sb-section" style="flex:1">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div class="sb-title" style="margin:0">📋 Лог</div>
        <button class="btn btn-ghost" style="width:auto;padding:4px 8px;font-size:9px" onclick="clearLog()">очистить</button>
      </div>
      <div class="log-box" id="log"><span class="log-empty">Событий пока нет...</span></div>
    </div>

  </div>

  <!-- CONTENT (остальной контент без изменений, только вкладки) -->
  <div class="content">

    <div class="tabs">
      <button class="tab active" onclick="sw('overview')">📊 Обзор</button>
      <button class="tab" onclick="sw('products')">📦 Товары</button>
      <button class="tab" onclick="sw('sellers')">👤 Продавцы</button>
      <button class="tab" onclick="sw('niches')">🏆 Ниши</button>
      <button class="tab" onclick="sw('keywords')">🔍 Слова</button>
      <button class="tab" onclick="sw('prices')">💰 Цены</button>
    </div>

    <!-- Все остальные секции остаются как в предыдущей версии -->
    <!-- (overview, products, sellers, niches, keywords, prices) -->

    <!-- ... (весь остальной HTML контента из предыдущего ответа) ... -->

  </div>
</div>

<script>
// === ПРЕДЫДУЩИЙ КОД + ИСПРАВЛЕНИЯ ===

const GH_USER = "avatiah", GH_REPO = "ebay-analyzer";
let DATA = [], COLS = {};
let pollTimer = null, currentRunId = null;

const store = {
  get:k=>{try{return localStorage.getItem(k)}catch{return null}},
  set:(k,v)=>{try{localStorage.setItem(k,v);return true}catch{return false}}
};

// Запоминание ключевого слова
function loadLastKeyword(){
  const last = store.get("LAST_KEYWORD");
  if(last) document.getElementById("kwInput").value = last;
}
function saveLastKeyword(kw){
  if(kw) store.set("LAST_KEYWORD", kw);
}

// Token
function toggleToken(){ 
  const i=document.getElementById("tokenInput"); 
  i.type=i.type==="password"?"text":"password"; 
}
function saveToken(){
  const v=document.getElementById("tokenInput").value.trim();
  if(!v){setS("tokenStatus","Введите токен","err");return}
  store.set("GH_TOKEN",v); setS("tokenStatus","✓ Сохранён","ok"); log("Токен сохранён","ok");
}

// Load on start
window.addEventListener("DOMContentLoaded",()=>{
  const t=store.get("GH_TOKEN"); 
  if(t){document.getElementById("tokenInput").value=t; setS("tokenStatus","✓ Загружен","ok");}
  loadLastKeyword();
  loadData();
});

// === ЭКСПОРТ В EXCEL ===
function exportToExcel() {
  if(!DATA.length){
    alert("Нет данных для экспорта");
    return;
  }

  const wb = XLSX.utils.book_new();

  // 1. Raw Data
  const rawData = DATA.map(row => {
    const obj = {};
    Object.keys(COLS).forEach(key => {
      obj[key] = c(row, key);
    });
    return obj;
  });
  const wsRaw = XLSX.utils.json_to_sheet(rawData);
  XLSX.utils.book_append_sheet(wb, wsRaw, "Raw Data");

  // 2. Overview Stats
  const prices = DATA.map(p).filter(x=>x>0);
  const overview = [
    ["Метрика", "Значение"],
    ["Всего товаров", DATA.length],
    ["Уникальных продавцов", new Set(DATA.map(r=>c(r,"seller")).filter(Boolean)).size],
    ["Средняя цена", prices.length ? (prices.reduce((a,b)=>a+b,0)/prices.length).toFixed(2) : 0],
    ["Мин цена", Math.min(...prices)],
    ["Макс цена", Math.max(...prices)],
    ["Opportunity Score", document.getElementById("opp-val")?.textContent || "—"]
  ];
  const wsOverview = XLSX.utils.aoa_to_sheet(overview);
  XLSX.utils.book_append_sheet(wb, wsOverview, "Обзор");

  // 3. Sellers Analysis
  const sellerMap = {};
  DATA.forEach(r => {
    const s = c(r,"seller");
    if(!s) return;
    if(!sellerMap[s]) sellerMap[s] = {count:0, prices:[]};
    sellerMap[s].count++;
    const pr = p(r);
    if(pr>0) sellerMap[s].prices.push(pr);
  });

  const sellersData = Object.entries(sellerMap).map(([name, data]) => ({
    "Продавец": name,
    "Товаров": data.count,
    "Ср. цена": data.prices.length ? (data.prices.reduce((a,b)=>a+b,0)/data.prices.length).toFixed(2) : 0,
    "Мин": Math.min(...data.prices),
    "Макс": Math.max(...data.prices)
  }));
  const wsSellers = XLSX.utils.json_to_sheet(sellersData);
  XLSX.utils.book_append_sheet(wb, wsSellers, "Продавцы");

  // 4. Products
  const productsData = DATA.map(r => ({
    "Название": c(r,"title"),
    "Цена": p(r),
    "Продавец": c(r,"seller"),
    "Feedback %": c(r,"seller_feedback_pct"),
    "Состояние": c(r,"condition"),
    "Ссылка": c(r,"url")
  }));
  const wsProducts = XLSX.utils.json_to_sheet(productsData);
  XLSX.utils.book_append_sheet(wb, wsProducts, "Товары");

  // Скачивание
  const keyword = document.getElementById("kwInput").value.trim() || "export";
  XLSX.writeFile(wb, `eBay_Analyzer_${keyword.replace(/[^a-zA-Z0-9]/g,'_')}_${new Date().toISOString().slice(0,10)}.xlsx`);
  
  log("✅ Excel-файл успешно экспортирован", "ok");
}

// Остальные функции (runScraper, renderNiches и т.д.) остаются как в предыдущей версии

async function runScraper(){
  const btn=document.getElementById("runBtn");
  const kw=document.getElementById("kwInput").value.trim();
  
  if(!kw){setS("runStatus","Введите ключевое слово","err");return;}
  
  saveLastKeyword(kw); // ← Сохраняем
  
  // ... остальной код runScraper без изменений
  if(!store.get("GH_TOKEN")){setS("runStatus","Сначала сохраните токен","err");return;}
  setS("runStatus","","info");setBL(btn,true);
  log(`Запуск для «${kw}»...`,"info");
  try{
    const ok=await sendDispatch("run-scraper",{keyword:kw});
    if(ok){setS("runStatus",`Запущен для «${kw}»`,"ok");startPolling();}
    else{setS("runStatus","Ошибка запуска","err");setBL(btn,false);}
  }catch(e){setS("runStatus","Ошибка: "+e.message,"err");setBL(btn,false);}
}

// ... (весь остальной JavaScript код из предыдущей версии)

</script>
</body>
</html>
