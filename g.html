<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eBay Market Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow:wght@300;400;500;600;700;900&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg:#05080f; --bg2:#090d18; --panel:#0d1220; --panel2:#111827;
      --border:#1a2540; --border2:#243050;
      --blue:#2563eb; --blue-b:#3b82f6;
      --green:#10b981; --red:#ef4444; --amber:#f59e0b;
      --text:#94a3b8; --text2:#cbd5e1; --bright:#f1f5f9;
      --mono:'Space Mono',monospace; --cond:'Barlow Condensed',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text2);min-height:100vh}
    .topbar{position:sticky;top:0;z-index:100;background:rgba(5,8,15,0.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 24px;height:54px;display:flex;align-items:center;justify-content:space-between}
    .export-btn{background:var(--green);color:white;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:700;margin-left:12px}
    .export-btn:hover{background:#0f9c6e}
  </style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center;gap:10px">
    <div style="width:30px;height:30px;background:#2563eb;border-radius:6px;display:grid;place-items:center;color:white;font-weight:bold">⬡</div>
    <div style="font-weight:900;font-size:18px;color:var(--bright)">eBay <span style="color:#3b82f6">Analyzer</span></div>
  </div>
  <div>
    <span id="lastUpd" style="font-family:var(--mono);font-size:11px;color:var(--text);margin-right:15px"></span>
    <button class="export-btn" onclick="exportToExcel()">📊 Экспорт в Excel</button>
  </div>
</div>

<div style="display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 54px)">
  <!-- Sidebar -->
  <div style="background:#090d18;border-right:1px solid #1a2540;padding:20px;display:flex;flex-direction:column;gap:16px">
    <div style="background:#0d1220;border:1px solid #1a2540;border-radius:10px;padding:16px">
      <div style="font-size:10px;font-weight:700;color:#94a3b8;margin-bottom:8px">🔑 TOKEN</div>
      <input type="password" id="tokenInput" placeholder="ghp_..." style="width:100%;padding:8px;background:#111827;border:1px solid #243050;border-radius:6px;color:white">
      <button onclick="toggleToken()" style="margin:6px 0">👁 Показать</button>
      <button onclick="saveToken()" style="width:100%;padding:8px;background:#1e2937;color:white;border:none;border-radius:6px">Сохранить токен</button>
    </div>

    <div style="background:#0d1220;border:1px solid #1a2540;border-radius:10px;padding:16px">
      <div style="font-size:10px;font-weight:700;color:#94a3b8;margin-bottom:8px">🚀 ЗАПУСК</div>
      <input type="text" id="kwInput" placeholder="vintage camera" style="width:100%;padding:8px;background:#111827;border:1px solid #243050;border-radius:6px;color:white">
      <button onclick="runScraper()" style="width:100%;margin-top:8px;padding:10px;background:#2563eb;color:white;border:none;border-radius:6px;font-weight:700">▶ Запустить сбор</button>
      <button onclick="loadData()" style="width:100%;margin-top:6px;padding:8px;background:#1e2937;color:#94a3b8;border:none;border-radius:6px">⟳ Обновить данные</button>
    </div>

    <div style="flex:1;background:#0d1220;border:1px solid #1a2540;border-radius:10px;padding:16px;overflow:auto" id="log">
      <div style="color:#64748b">Лог инициализирован...</div>
    </div>
  </div>

  <!-- Content -->
  <div style="padding:20px">
    <div style="display:flex;gap:2px;margin-bottom:20px;background:#0d1220;border:1px solid #1a2540;border-radius:8px;overflow:hidden">
      <button onclick="sw('overview')" class="tab active">📊 Обзор</button>
      <button onclick="sw('products')" class="tab">📦 Товары</button>
      <button onclick="sw('sellers')" class="tab">👤 Продавцы</button>
      <button onclick="sw('niches')" class="tab">🏆 Ниши</button>
      <button onclick="sw('prices')" class="tab">💰 Цены</button>
    </div>

    <div id="tab-overview" class="section active">Загрузка данных...</div>
    <div id="tab-products" class="section">Товары</div>
    <div id="tab-sellers" class="section">Продавцы</div>
    <div id="tab-niches" class="section">Ниши</div>
    <div id="tab-prices" class="section">Цены</div>
  </div>
</div>

<script>
// ==================== ОСНОВНОЙ КОД ====================
const GH_USER = "avatiah", GH_REPO = "ebay-analyzer";
let DATA = [], COLS = {};

const store = {get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v);return true}catch{return false}}};

function log(msg, type="info") {
  const el = document.getElementById("log");
  const color = type==="ok"?"#10b981":type==="err"?"#ef4444":"#94a3b8";
  el.innerHTML += `<div style="padding:2px 0;color:${color}">${new Date().toLocaleTimeString("ru-RU")} — ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

async function ghFetch(path) {
  const token = store.get("GH_TOKEN");
  const res = await fetch(`https://api.github.com${path}`, {headers: token?{"Authorization":`Bearer ${token}`}: {}});
  const body = await res.json().catch(()=> ({}));
  return {ok: res.ok, body};
}

async function loadData() {
  log("Загрузка данных...");
  try {
    const {ok, body} = await ghFetch(`/repos/${GH_USER}/${GH_REPO}/contents/data/raw_data.csv`);
    if (!ok) return log("CSV файл не найден", "err");
    const csv = atob(body.content.replace(/\n/g,""));
    parseCSV(csv);
    log(`Успешно загружено ${DATA.length} товаров`, "ok");
    document.getElementById("lastUpd").textContent = "Обновлено: только что";
  } catch(e) {
    log("Ошибка загрузки: " + e.message, "err");
  }
}

function parseCSV(text) {
  const lines = text.trim().split("\n");
  COLS = {};
  lines[0].split(",").forEach((h,i) => COLS[h.trim()] = i);
  DATA = lines.slice(1).map(line => {
    const row = [];
    let cur = "", inQ = false;
    for (let ch of line) {
      if (ch === '"') inQ = !inQ;
      else if (ch === "," && !inQ) { row.push(cur); cur = ""; }
      else cur += ch;
    }
    row.push(cur);
    return row;
  });
}

function c(row, name) { return row[COLS[name]] || ""; }
function p(row) { return parseFloat(c(row,"price")) || 0; }

// Экспорт в Excel
function exportToExcel() {
  if (DATA.length === 0) return alert("Нет данных для экспорта");
  
  const wb = XLSX.utils.book_new();
  const data = DATA.map(r => ({
    "Название": c(r,"title"),
    "Цена": p(r),
    "Продавец": c(r,"seller"),
    "Feedback %": c(r,"seller_feedback_pct"),
    "Состояние": c(r,"condition"),
    "Ссылка": c(r,"url")
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  XLSX.utils.book_append_sheet(wb, ws, "Товары");
  XLSX.writeFile(wb, `eBay_Analyzer_${document.getElementById("kwInput").value || "data"}_${new Date().toISOString().slice(0,10)}.xlsx`);
  log("✅ Файл Excel успешно скачан", "ok");
}

// Tabs
function sw(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelector(`button[onclick="sw('${tab}')"]`).classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
}

// Run
async function runScraper() {
  const kw = document.getElementById("kwInput").value.trim();
  if (!kw) return alert("Введите ключевое слово");
  // ... (sendDispatch)
  log(`Запущен сбор для: ${kw}`);
}

// Init
window.addEventListener("DOMContentLoaded", () => {
  loadData();
  log("Интерфейс готов", "ok");
});
</script>
</body>
</html>
