<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eBay Market Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow:wght@300;400;500;600;700;900&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg:#05080f; --bg2:#090d18; --panel:#0d1220; --panel2:#111827;
      --border:#1a2540; --border2:#243050;
      --blue:#2563eb; --blue-b:#3b82f6; --green:#10b981; --red:#ef4444; --amber:#f59e0b;
      --text:#94a3b8; --text2:#cbd5e1; --bright:#f1f5f9;
      --mono:'Space Mono',monospace; --cond:'Barlow Condensed',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text2);min-height:100vh}
    .topbar{position:sticky;top:0;z-index:100;background:rgba(5,8,15,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between}
    .tab{padding:12px 20px;background:none;border:none;color:var(--text);cursor:pointer;font-weight:600}
    .tab.active{background:var(--blue);color:white}
    .section{display:none}
    .section.active{display:block}
    .export-btn{background:var(--green);color:white;padding:8px 16px;border-radius:6px;font-weight:700}
  </style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center;gap:12px">
    <div style="background:var(--blue);width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:white;font-size:20px">⬡</div>
    <div style="font-size:21px;font-weight:900;color:var(--bright)">eBay Analyzer</div>
  </div>
  <div>
    <span id="lastUpd" style="font-family:var(--mono);margin-right:15px"></span>
    <button onclick="exportToExcel()" class="export-btn">📊 Экспорт в Excel</button>
  </div>
</div>

<div style="display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 56px)">
  <!-- Sidebar -->
  <div style="background:var(--bg2);border-right:1px solid var(--border);padding:20px;display:flex;flex-direction:column;gap:16px">
    <div style="background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px">
      <div style="font-size:10px;font-weight:700;color:var(--text)">🔑 TOKEN</div>
      <input type="password" id="tokenInput" placeholder="ghp_..." style="width:100%;padding:9px;background:var(--panel2);border:1px solid var(--border2);border-radius:6px;color:var(--bright);margin:8px 0">
      <button onclick="saveToken()" style="width:100%;padding:9px;background:#1e2937;color:white;border:none;border-radius:6px">Сохранить токен</button>
    </div>

    <div style="background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px">
      <div style="font-size:10px;font-weight:700;color:var(--text)">🚀 ЗАПУСК</div>
      <input type="text" id="kwInput" placeholder="vintage camera" style="width:100%;padding:9px;background:var(--panel2);border:1px solid var(--border2);border-radius:6px;color:var(--bright);margin:8px 0">
      <button onclick="runScraper()" style="width:100%;padding:11px;background:var(--blue);color:white;border:none;border-radius:6px;font-weight:700">▶ Запустить сбор</button>
      <button onclick="loadData()" style="width:100%;margin-top:8px;padding:9px;background:var(--panel2);color:var(--text2);border:1px solid var(--border2);border-radius:6px">⟳ Обновить данные</button>
    </div>

    <div style="flex:1;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;overflow:auto;font-family:var(--mono);font-size:10px" id="log"></div>
  </div>

  <!-- Main -->
  <div style="padding:24px">
    <div style="display:flex;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px">
      <button onclick="sw('overview')" class="tab active">📊 Обзор</button>
      <button onclick="sw('products')" class="tab">📦 Товары</button>
      <button onclick="sw('sellers')" class="tab">👤 Продавцы</button>
      <button onclick="sw('niches')" class="tab">🏆 Ниши</button>
      <button onclick="sw('prices')" class="tab">💰 Цены</button>
    </div>

    <!-- Ниши -->
    <div id="tab-niches" class="section active">
      <h2>🏆 Анализ ниши</h2>
      <div id="opportunity" style="background:var(--panel);padding:20px;border-radius:12px;margin:20px 0"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
        <div style="background:var(--panel);padding:18px;border-radius:12px">
          <h3>Power Sellers</h3>
          <div id="power-sellers"></div>
        </div>
        <div style="background:var(--panel);padding:18px;border-radius:12px">
          <h3>Sweet Spot</h3>
          <div id="sweet-spot"></div>
        </div>
      </div>
      <div style="margin-top:20px;background:var(--panel);padding:18px;border-radius:12px">
        <h3>Winning Keywords</h3>
        <div id="winning-keywords" style="display:flex;flex-wrap:wrap;gap:8px"></div>
      </div>
    </div>

    <!-- Другие вкладки -->
    <div id="tab-overview" class="section">Обзор (данные загружены)</div>
    <div id="tab-products" class="section">Товары — <span id="prod-count"></span></div>
    <div id="tab-sellers" class="section">Продавцы</div>
    <div id="tab-prices" class="section">Цены</div>
  </div>
</div>

<script>
const GH_USER = "avatiah", GH_REPO = "ebay-analyzer";
let DATA = [], COLS = {};

const store = {get:k=>{try{return localStorage.getItem(k)}catch{return null}}, set:(k,v)=>{try{localStorage.setItem(k,v);return true}catch{return false}}};

function log(msg, type="info") {
  const el = document.getElementById("log");
  const color = type === "ok" ? "#10b981" : type === "err" ? "#ef4444" : "#94a3b8";
  el.innerHTML += `<div style="color:${color}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

async function loadData() {
  log("Загрузка данных...");
  try {
    const token = store.get("GH_TOKEN");
    const res = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/data/raw_data.csv`, {
      headers: token ? { "Authorization": `Bearer ${token}` } : {}
    });
    if (!res.ok) throw new Error("CSV не найден");
    const data = await res.json();
    const csv = atob(data.content.replace(/\n/g, ""));
    parseCSV(csv);
    log(`Загружено ${DATA.length} записей`, "ok");
    renderAll();
  } catch (e) {
    log("Ошибка загрузки: " + e.message, "err");
  }
}

function parseCSV(text) {
  const lines = text.trim().split("\n");
  COLS = {};
  lines[0].split(",").forEach((h,i) => COLS[h.trim()] = i);
  DATA = lines.slice(1).map(line => {
    const row = [];
    let cur = "", inQ = false;
    for (let ch of line) {
      if (ch === '"') inQ = !inQ;
      else if (ch === "," && !inQ) { row.push(cur); cur = ""; }
      else cur += ch;
    }
    row.push(cur);
    return row;
  });
}

function c(row, name) { return row[COLS[name]] || ""; }
function p(row) { return parseFloat(c(row, "price")) || 0; }

function renderAll() {
  if (!DATA.length) return;
  renderNiches();
  document.getElementById("prod-count").textContent = DATA.length + " товаров";
}

function renderNiches() {
  const prices = DATA.map(p).filter(x => x > 0);
  const uniqueSellers = new Set(DATA.map(r => c(r, "seller")).filter(Boolean)).size;
  const avgPrice = prices.length ? prices.reduce((a,b) => a+b, 0) / prices.length : 0;

  const oppScore = Math.min(98, Math.max(25, 140 - uniqueSellers * 4 + Math.floor(avgPrice / 5)));

  document.getElementById("opportunity").innerHTML = `
    <h3>Opportunity Score: <span style="font-size:48px;color:${oppScore>75?'#10b981':oppScore>55?'#f59e0b':'#ef4444'}">${oppScore}</span></h3>
    <p>${oppScore > 75 ? 'Отличная ниша!' : oppScore > 55 ? 'Хорошая возможность' : 'Высокая конкуренция'}</p>
  `;

  // Power Sellers
  const sellersMap = {};
  DATA.forEach(r => {
    const s = c(r,"seller");
    if (!s) return;
    if (!sellersMap[s]) sellersMap[s] = {count:0, fb: parseFloat(c(r,"seller_feedback_pct"))||0};
    sellersMap[s].count++;
  });
  const power = Object.entries(sellersMap).sort((a,b)=>b[1].count-a[1].count).slice(0,6);
  document.getElementById("power-sellers").innerHTML = power.map(([name, data]) => 
    `<div>${name} — ${data.count} товаров (${data.fb}%)</div>`
  ).join('');

  // Sweet Spot
  const sortedPrices = [...prices].sort((a,b)=>a-b);
  const sweetLow = sortedPrices[Math.floor(sortedPrices.length * 0.25)] || 0;
  const sweetHigh = sortedPrices[Math.floor(sortedPrices.length * 0.75)] || 0;
  document.getElementById("sweet-spot").innerHTML = `<strong>$${Math.round(sweetLow)} — $${Math.round(sweetHigh)}</strong>`;

  log("Анализ ниши выполнен", "ok");
}

function exportToExcel() {
  if (!DATA.length) return alert("Нет данных для экспорта");
  const wb = XLSX.utils.book_new();
  const exportData = DATA.map(r => ({
    "Title": c(r,"title"),
    "Price": p(r),
    "Seller": c(r,"seller"),
    "Feedback": c(r,"seller_feedback_pct"),
    "Condition": c(r,"condition"),
    "URL": c(r,"url")
  }));
  const ws = XLSX.utils.json_to_sheet(exportData);
  XLSX.utils.book_append_sheet(wb, ws, "eBay Data");
  XLSX.writeFile(wb, `eBay_Analyzer_${new Date().toISOString().slice(0,10)}.xlsx`);
  log("Экспорт в Excel выполнен", "ok");
}

function sw(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelector(`button[onclick="sw('${tab}')"]`).classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
}

function toggleToken() {
  const inp = document.getElementById("tokenInput");
  inp.type = inp.type === "password" ? "text" : "password";
}

function saveToken() {
  const v = document.getElementById("tokenInput").value.trim();
  if (v) store.set("GH_TOKEN", v);
  log("Токен сохранён");
}

async function runScraper() {
  const kw = document.getElementById("kwInput").value.trim();
  if (!kw) return alert("Введите ключевое слово");
  log(`Запущен сбор для: ${kw}`);
}

// Init
window.addEventListener("DOMContentLoaded", () => {
  log("Интерфейс загружен. Нажмите 'Обновить данные'", "ok");
});
</script>
</body>
</html>
