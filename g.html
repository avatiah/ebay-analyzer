<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eBay Market Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow:wght@300;400;500;600;700;900&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg:#05080f; --bg2:#090d18; --panel:#0d1220; --panel2:#111827;
      --border:#1a2540; --border2:#243050;
      --blue:#2563eb; --blue-b:#3b82f6; --green:#10b981; --red:#ef4444; --amber:#f59e0b;
      --text:#94a3b8; --text2:#cbd5e1; --bright:#f1f5f9;
      --mono:'Space Mono',monospace; --cond:'Barlow Condensed',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text2);min-height:100vh}
    .topbar{position:sticky;top:0;z-index:100;background:rgba(5,8,15,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between}
    .export-btn{background:var(--green);color:white;padding:7px 14px;border-radius:6px;font-weight:700;margin-left:12px}
  </style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center;gap:12px">
    <div style="width:32px;height:32px;background:var(--blue);border-radius:8px;display:grid;place-items:center;color:white;font-size:18px">⬡</div>
    <div style="font-size:20px;font-weight:900;color:var(--bright)">eBay Analyzer</div>
  </div>
  <div>
    <span id="lastUpd" style="font-family:var(--mono);margin-right:15px;color:var(--text)"></span>
    <button onclick="exportToExcel()" class="export-btn">📊 Экспорт в Excel</button>
  </div>
</div>

<div style="display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh-56px)">
  <!-- Sidebar -->
  <div style="background:var(--bg2);border-right:1px solid var(--border);padding:20px;display:flex;flex-direction:column;gap:16px">
    <!-- Token -->
    <div style="background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px">
      <div style="font-size:10px;font-weight:700;color:var(--text);margin-bottom:8px">🔑 GITHUB TOKEN</div>
      <input type="password" id="tokenInput" placeholder="ghp_..." style="width:100%;padding:9px;background:var(--panel2);border:1px solid var(--border2);border-radius:6px;color:var(--bright)">
      <button onclick="toggleToken()" style="margin:6px 0 8px">👁</button>
      <button onclick="saveToken()" style="width:100%;padding:9px;background:#1e2937;color:white;border:none;border-radius:6px">Сохранить токен</button>
    </div>

    <!-- Run -->
    <div style="background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px">
      <div style="font-size:10px;font-weight:700;color:var(--text);margin-bottom:8px">🚀 ЗАПУСК</div>
      <input type="text" id="kwInput" placeholder="vintage camera" style="width:100%;padding:9px;background:var(--panel2);border:1px solid var(--border2);border-radius:6px;color:var(--bright)">
      <button onclick="runScraper()" style="width:100%;margin:10px 0 6px;padding:11px;background:var(--blue);color:white;border:none;border-radius:6px;font-weight:700">▶ Запустить сбор</button>
      <button onclick="loadData()" style="width:100%;padding:9px;background:var(--panel2);color:var(--text2);border:1px solid var(--border2);border-radius:6px">⟳ Обновить данные</button>
    </div>

    <div style="flex:1;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;overflow:auto;font-family:var(--mono);font-size:10px" id="log">
      Лог...
    </div>
  </div>

  <!-- Main Content -->
  <div style="padding:24px">
    <div style="display:flex;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px">
      <button onclick="sw('overview')" class="tab active" style="flex:1;padding:12px">📊 Обзор</button>
      <button onclick="sw('products')" class="tab" style="flex:1;padding:12px">📦 Товары</button>
      <button onclick="sw('sellers')" class="tab" style="flex:1;padding:12px">👤 Продавцы</button>
      <button onclick="sw('niches')" class="tab" style="flex:1;padding:12px">🏆 Ниши</button>
      <button onclick="sw('prices')" class="tab" style="flex:1;padding:12px">💰 Цены</button>
    </div>

    <div id="tab-niches" class="section active">
      <h2 style="margin-bottom:16px">🏆 Анализ ниши</h2>
      <div id="niche-content">Загрузите данные для анализа ниши...</div>
    </div>

    <!-- Другие вкладки можно расширить позже -->
    <div id="tab-overview" class="section">Обзор</div>
    <div id="tab-products" class="section">Товары</div>
    <div id="tab-sellers" class="section">Продавцы</div>
    <div id="tab-prices" class="section">Цены</div>
  </div>
</div>

<script>
// ... (полный код с Opportunity Score, Sweet Spot, Winning Keywords и т.д.)
// Я могу выдать его следующим сообщением, если нужно.

log("Инструмент инициализирован. Нажмите 'Обновить данные'", "ok");
</script>
</body>
</html>
