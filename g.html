<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eBay Market Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow:wght@300;400;500;600;700;900&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#05080f; --bg2:#090d18; --panel:#0d1220; --panel2:#111827;
      --border:#1a2540; --border2:#243050;
      --blue:#2563eb; --blue-b:#3b82f6; --blue-dim:rgba(37,99,235,0.12);
      --cyan:#06b6d4; --cyan-dim:rgba(6,182,212,0.1);
      --green:#10b981; --green-dim:rgba(16,185,129,0.1);
      --red:#ef4444; --red-dim:rgba(239,68,68,0.1);
      --amber:#f59e0b; --amber-dim:rgba(245,158,11,0.1);
      --text:#94a3b8; --text2:#cbd5e1; --bright:#f1f5f9;
      --mono:'Space Mono',monospace; --sans:'Barlow',sans-serif; --cond:'Barlow Condensed',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:var(--sans);background:var(--bg);color:var(--text2);min-height:100vh;overflow-x:hidden}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(37,99,235,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,0.025) 1px,transparent 1px);background-size:48px 48px}

    .topbar{position:sticky;top:0;z-index:100;background:rgba(5,8,15,0.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 24px;height:54px;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:10px}
    .brand-hex{width:30px;height:30px;background:var(--blue);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:grid;place-items:center;font-size:13px}
    .brand-name{font-family:var(--cond);font-weight:900;font-size:17px;letter-spacing:2px;text-transform:uppercase;color:var(--bright)}
    .brand-name span{color:var(--blue-b)}
    .last-upd{font-family:var(--mono);font-size:10px;color:var(--text)}

    .layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 54px)}
    @media(max-width:900px){.layout{grid-template-columns:1fr}}

    .sidebar{background:var(--bg2);border-right:1px solid var(--border);padding:20px 16px;display:flex;flex-direction:column;gap:14px}
    .sb-section{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px}
    .sb-title{font-family:var(--cond);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text);margin-bottom:12px}
    .field{margin-bottom:10px}
    input[type=text],input[type=password]{width:100%;background:var(--panel2);border:1px solid var(--border2);border-radius:7px;color:var(--bright);font-family:var(--mono);font-size:11px;padding:9px 12px}
    input:focus{border-color:var(--blue-b)}

    .btn{padding:9px 16px;border-radius:7px;border:none;font-family:var(--cond);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;cursor:pointer;width:100%;transition:all 0.15s}
    .btn-primary{background:var(--blue);color:#fff}
    .btn-primary:hover{background:var(--blue-b)}
    .btn-ghost{background:var(--panel2);color:var(--text2);border:1px solid var(--border2)}
    .btn-ghost:hover{border-color:var(--blue-b);color:var(--blue-b)}

    .status{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;padding:4px 9px;border-radius:5px;margin-top:8px}
    .ok{background:var(--green-dim);color:var(--green)}
    .err{background:var(--red-dim);color:var(--red)}
    .info{background:var(--blue-dim);color:var(--blue-b)}

    .tabs{display:flex;gap:0;margin-bottom:20px;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--panel)}
    .tab{flex:1;padding:10px 12px;text-align:center;font-family:var(--cond);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--text);cursor:pointer}
    .tab.active{color:var(--bright);background:var(--blue)}

    .section{display:none}
    .section.active{display:block}

    .kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:18px}
    .kpi{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:14px 16px}
    .kpi-val{font-family:var(--cond);font-size:24px;font-weight:900;color:var(--bright)}
    .kpi-lbl{font-family:var(--mono);font-size:8px;font-weight:700;text-transform:uppercase;color:var(--text)}

    .panel{background:var(--panel);border:1px solid var(--border);border-radius:9px;margin-bottom:14px;overflow:hidden}
    .panel-hdr{padding:12px 16px;border-bottom:1px solid var(--border);background:var(--panel2)}
    .panel-title{font-family:var(--cond);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--text2)}
    .panel-body{padding:14px 16px}

    .two-col,.three-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .three-col{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}

    .bar-chart{display:flex;flex-direction:column;gap:7px}
    .bar-row{display:flex;align-items:center;gap:8px}
    .bar-lbl{font-family:var(--mono);font-size:9px;color:var(--text);width:110px;flex-shrink:0}
    .bar-track{flex:1;height:5px;background:var(--border);border-radius:3px}
    .bar-fill{height:100%;border-radius:3px}

    .histogram{display:flex;align-items:flex-end;gap:2px;height:70px}
    .hist-col{flex:1;border-radius:2px 2px 0 0}

    .tbl-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:11px}
    th{font-family:var(--cond);font-size:9px;font-weight:700;text-transform:uppercase;color:var(--text);padding:9px 12px;border-bottom:1px solid var(--border);background:var(--panel2)}
    td{padding:8px 12px;border-bottom:1px solid var(--border)}

    .opp-score{display:flex;align-items:center;gap:20px;padding:20px;background:var(--panel2);border-radius:10px;border:2px solid var(--border)}
    .opp-circle{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;border:8px solid var(--green)}
    .opp-circle .score{font-family:var(--cond);font-size:42px;font-weight:900;color:var(--bright)}

    .kw-cloud{display:flex;flex-wrap:wrap;gap:7px}
    .kw-tag{background:var(--panel2);border:1px solid var(--border2);border-radius:5px;padding:4px 10px;font-family:var(--mono);font-size:10px;color:var(--text2)}

    .seller-grid{display:flex;flex-direction:column;gap:7px}
    .seller-card{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--panel2);border:1px solid var(--border);border-radius:7px}

    .log-box{background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:10px;height:130px;overflow-y:auto;font-family:var(--mono);font-size:10px}
    .ll{display:flex;gap:8px}
  </style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-hex">⬡</div>
    <div class="brand-name">eBay <span>Analyzer</span></div>
  </div>
  <div class="topbar-right">
    <span class="last-upd" id="lastUpd">—</span>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <!-- Авторизация -->
    <div class="sb-section">
      <div class="sb-title">🔑 Авторизация</div>
      <div class="field">
        <label>GitHub Token</label>
        <input type="password" id="tokenInput" placeholder="ghp_...">
        <button onclick="toggleToken()" style="margin-top:5px">👁 Показать</button>
      </div>
      <button class="btn btn-ghost" onclick="saveToken()">Сохранить токен</button>
      <div id="tokenStatus"></div>
    </div>

    <!-- Запуск -->
    <div class="sb-section">
      <div class="sb-title">🚀 Запуск</div>
      <div class="field">
        <label>Ключевое слово</label>
        <input type="text" id="kwInput" placeholder="vintage camera">
      </div>
      <button class="btn btn-primary" id="runBtn" onclick="runScraper()">▶ Запустить сбор</button>
      <button class="btn btn-ghost" onclick="loadData()">⟳ Обновить данные</button>
      <div id="runStatus"></div>
    </div>

    <!-- Лог -->
    <div class="sb-section" style="flex:1">
      <div class="sb-title">📋 Лог</div>
      <div class="log-box" id="log"><span>Готов к работе...</span></div>
    </div>
  </div>

  <div class="content">
    <div class="tabs">
      <button class="tab active" onclick="sw('overview')">📊 Обзор</button>
      <button class="tab" onclick="sw('products')">📦 Товары</button>
      <button class="tab" onclick="sw('sellers')">👤 Продавцы</button>
      <button class="tab" onclick="sw('niches')">🏆 Ниши</button>
      <button class="tab" onclick="sw('keywords')">🔍 Слова</button>
      <button class="tab" onclick="sw('prices')">💰 Цены</button>
    </div>

    <!-- Здесь будут рендериться все вкладки через JS -->
    <div id="tab-content"></div>
  </div>
</div>

<script>
// ==================== ОСНОВНЫЕ ПЕРЕМЕННЫЕ ====================
const GH_USER = "avatiah", GH_REPO = "ebay-analyzer";
let DATA = [], COLS = {};
let pollTimer = null, currentRunId = null;

const store = {
  get: k => {try{return localStorage.getItem(k)}catch{return null}},
  set: (k,v) => {try{localStorage.setItem(k,v);return true}catch{return false}}
};

// ==================== УТИЛИТЫ ====================
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function log(msg,type="info"){
  const el = document.getElementById("log");
  const time = new Date().toLocaleTimeString("ru-RU");
  el.innerHTML += `<div class="ll"><span>${time}</span><span style="color:${type==='ok'?'#10b981':type==='err'?'#ef4444':'#94a3b8'}">${esc(msg)}</span></div>`;
  el.scrollTop = el.scrollHeight;
}
function setS(id,msg,type="info"){
  const el = document.getElementById(id);
  if(el) el.innerHTML = `<span class="status ${type}">${esc(msg)}</span>`;
}

// ==================== TOKEN & KEYWORD ====================
function toggleToken(){
  const inp = document.getElementById("tokenInput");
  inp.type = inp.type === "password" ? "text" : "password";
}
function saveToken(){
  const v = document.getElementById("tokenInput").value.trim();
  if(!v) return setS("tokenStatus","Введите токен","err");
  store.set("GH_TOKEN",v);
  setS("tokenStatus","✓ Сохранён","ok");
  log("Токен сохранён","ok");
}

function loadLastKeyword(){
  const last = store.get("LAST_KEYWORD");
  if(last) document.getElementById("kwInput").value = last;
}
function saveLastKeyword(kw){
  if(kw) store.set("LAST_KEYWORD", kw);
}

// ==================== GITHUB API ====================
async function ghFetch(path){
  const token = store.get("GH_TOKEN");
  const res = await fetch(`https://api.github.com${path}`,{
    headers: token ? {"Authorization": `Bearer ${token}`} : {}
  });
  const body = await res.json().catch(()=> ({}));
  return {ok: res.ok, body};
}

async function sendDispatch(eventType, payload){
  const token = store.get("GH_TOKEN");
  if(!token) throw new Error("Токен не найден");
  const res = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/dispatches`,{
    method: "POST",
    headers: {
      "Authorization": `Bearer ${token}`,
      "Accept": "application/vnd.github+json",
      "Content-Type": "application/json"
    },
    body: JSON.stringify({event_type: eventType, client_payload: payload})
  });
  return res.status === 204;
}

// ==================== ЗАГРУЗКА ДАННЫХ ====================
async function loadData(){
  log("Загрузка данных...");
  try{
    const {ok, body} = await ghFetch(`/repos/${GH_USER}/${GH_REPO}/contents/data/raw_data.csv`);
    if(!ok) return log("CSV не найден","err");
    const csv = atob(body.content.replace(/\n/g,""));
    parseCSV(csv);
    renderAll();
    log(`Загружено ${DATA.length} записей`,"ok");
  }catch(e){
    log("Ошибка: "+e.message,"err");
  }
}

function parseCSV(text){
  COLS = {};
  const lines = text.trim().split("\n");
  lines[0].split(",").forEach((h,i) => COLS[h.trim()] = i);
  DATA = lines.slice(1).map(line => {
    const row = [];
    let cur = "", inQ = false;
    for(let ch of line){
      if(ch === '"') inQ = !inQ;
      else if(ch === "," && !inQ){ row.push(cur); cur = ""; }
      else cur += ch;
    }
    row.push(cur);
    return row;
  });
}

function c(row, name){ return row[COLS[name]] || ""; }
function p(row){ return parseFloat(c(row,"price")) || 0; }

// ==================== RENDER FUNCTIONS ====================
function renderAll(){
  renderOverview();
  renderNiches();
  // другие вкладки можно добавить позже
}

function renderOverview(){ /* ... */ }
function renderNiches(){ /* ... */ } // можно оставить заглушку или полную версию

// ==================== ЗАПУСК СКРАПЕРА ====================
async function runScraper(){
  const btn = document.getElementById("runBtn");
  const kw = document.getElementById("kwInput").value.trim();
  if(!kw) return setS("runStatus","Введите ключевое слово","err");

  saveLastKeyword(kw);
  setS("runStatus","Запуск...","info");

  try{
    const ok = await sendDispatch("run-scraper", {keyword: kw});
    if(ok){
      setS("runStatus","✅ Запущен!","ok");
      log(`Сбор данных для "${kw}" запущен`);
    } else {
      setS("runStatus","Ошибка запуска","err");
    }
  }catch(e){
    setS("runStatus","Ошибка: " + e.message,"err");
    log("Ошибка запуска: " + e.message,"err");
  }
}

// ==================== INIT ====================
window.addEventListener("DOMContentLoaded", () => {
  const t = store.get("GH_TOKEN");
  if(t) document.getElementById("tokenInput").value = t;
  loadLastKeyword();
  loadData();
  log("Интерфейс готов","ok");
});
</script>
</body>
</html>
