<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnostics · eBay Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080b10;
      --bg2: #0e1219;
      --surface: #131720;
      --surface2: #1a2030;
      --border: #1f2840;
      --border2: #2a3550;
      --accent: #00d4ff;
      --accent-dim: rgba(0,212,255,0.08);
      --accent-glow: rgba(0,212,255,0.25);
      --green: #00e676;
      --green-dim: rgba(0,230,118,0.08);
      --red: #ff4d6a;
      --red-dim: rgba(255,77,106,0.08);
      --yellow: #ffd740;
      --yellow-dim: rgba(255,215,64,0.08);
      --orange: #ff9100;
      --text: #8899bb;
      --text2: #aabbd4;
      --text-bright: #dde8f5;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text2);
      min-height: 100vh;
      padding: 0;
    }

    /* Scanline overlay */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
      pointer-events: none;
      z-index: 999;
    }

    /* ── Top bar ── */
    .topbar {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .topbar-left { display: flex; align-items: center; gap: 14px; }
    .logo {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.5px;
    }
    .logo span { color: var(--text); font-weight: 400; }
    .topbar-badge {
      font-family: var(--mono);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid rgba(0,212,255,0.2);
      letter-spacing: 0.5px;
    }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    #globalStatus {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text);
    }

    /* ── Layout ── */
    .main { padding: 28px; max-width: 1100px; margin: 0 auto; }

    /* ── Token setup ── */
    .token-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .token-bar label {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text);
      white-space: nowrap;
    }
    .token-wrap { position: relative; flex: 1; min-width: 220px; }
    .token-wrap input {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: 7px;
      color: var(--text-bright);
      font-family: var(--mono);
      font-size: 12px;
      padding: 9px 38px 9px 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .token-wrap input:focus { border-color: var(--accent); }
    .eye-btn {
      position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--text); font-size: 14px; padding: 0;
    }
    #tokenMsg { font-family: var(--mono); font-size: 11px; white-space: nowrap; }

    /* ── Section header ── */
    .section-hdr {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 14px; margin-top: 28px;
    }
    .section-hdr h2 {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }
    .section-hdr::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Check grid ── */
    .check-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
    }

    /* ── Check card ── */
    .check-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      transition: border-color 0.2s;
    }
    .check-card.pass  { border-left: 3px solid var(--green); }
    .check-card.fail  { border-left: 3px solid var(--red); }
    .check-card.warn  { border-left: 3px solid var(--yellow); }
    .check-card.info  { border-left: 3px solid var(--accent); }
    .check-card.idle  { border-left: 3px solid var(--border2); }
    .check-card.running { border-left: 3px solid var(--orange); }

    .check-top {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
      margin-bottom: 8px;
    }
    .check-name {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-bright);
    }
    .check-icon { font-size: 16px; flex-shrink: 0; }

    .check-desc {
      font-size: 12px;
      color: var(--text);
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .check-result {
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.6;
      padding: 8px 10px;
      background: var(--bg2);
      border-radius: 6px;
      color: var(--text2);
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 32px;
    }
    .check-result.pass { color: var(--green); }
    .check-result.fail { color: var(--red); }
    .check-result.warn { color: var(--yellow); }
    .check-result.info { color: var(--accent); }

    /* ── Workflow runs table ── */
    .runs-table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    th {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 11px 16px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    td {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text2);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }

    .run-status {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-radius: 5px;
      font-size: 10px; font-weight: 600; letter-spacing: 0.3px;
    }
    .run-status.success { background: var(--green-dim); color: var(--green); }
    .run-status.failure { background: var(--red-dim); color: var(--red); }
    .run-status.in_progress { background: var(--yellow-dim); color: var(--yellow); }
    .run-status.queued { background: var(--accent-dim); color: var(--accent); }
    .run-status.skipped { background: rgba(100,100,120,0.1); color: #667; }

    .run-link { color: var(--accent); text-decoration: none; }
    .run-link:hover { text-decoration: underline; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 16px; border-radius: 7px; border: none;
      font-family: var(--mono); font-size: 12px; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:not(:disabled):active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:not(:disabled):hover { opacity: 0.85; }
    .btn-ghost {
      background: var(--surface2); color: var(--text2);
      border: 1px solid var(--border2);
    }
    .btn-ghost:not(:disabled):hover { border-color: var(--accent); color: var(--accent); }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 12px; height: 12px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    /* ── Log ── */
    .log-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      height: 180px;
      overflow-y: auto;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.8;
    }
    .ll { display: flex; gap: 12px; }
    .lt { color: var(--text); flex-shrink: 0; }
    .lm.ok   { color: var(--green); }
    .lm.err  { color: var(--red); }
    .lm.warn { color: var(--yellow); }
    .lm.info { color: var(--accent); }
    .lm.plain { color: var(--text2); }
    .log-empty { color: var(--text); font-style: italic; }

    /* ── Summary bar ── */
    .summary {
      display: flex; gap: 12px; flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .sum-chip {
      display: flex; align-items: center; gap: 7px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      font-family: var(--mono);
      font-size: 12px;
    }
    .sum-chip .val { font-size: 20px; font-weight: 600; color: var(--text-bright); }
    .sum-chip .lbl { color: var(--text); font-size: 10px; display: block; margin-top: 1px; }
    .sum-chip.c-pass .val { color: var(--green); }
    .sum-chip.c-fail .val { color: var(--red); }
    .sum-chip.c-warn .val { color: var(--yellow); }

    /* ── Empty state ── */
    .empty {
      text-align: center; padding: 40px;
      color: var(--text); font-family: var(--mono); font-size: 12px;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .check-card { animation: fadeIn 0.25s ease both; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">ebay<span>-analyzer</span> / diagnostics</div>
    <div class="topbar-badge">LIVE</div>
  </div>
  <div class="topbar-right">
    <span id="globalStatus">—</span>
    <button class="btn btn-primary" id="runAllBtn" onclick="runAll()">
      <span class="spinner" id="mainSpinner" style="display:none"></span>
      <span>▶ Запустить диагностику</span>
    </button>
  </div>
</div>

<div class="main">

  <!-- Token -->
  <div class="token-bar">
    <label>GitHub Token</label>
    <div class="token-wrap">
      <input type="password" id="tokenInput" placeholder="ghp_...">
      <button class="eye-btn" onclick="toggleToken()">👁</button>
    </div>
    <button class="btn btn-ghost" onclick="saveToken()">Сохранить</button>
    <span id="tokenMsg"></span>
  </div>

  <!-- Summary -->
  <div class="summary" id="summary" style="display:none">
    <div class="sum-chip c-pass"><div><div class="val" id="s-pass">0</div><div class="lbl">PASSED</div></div></div>
    <div class="sum-chip c-fail"><div><div class="val" id="s-fail">0</div><div class="lbl">FAILED</div></div></div>
    <div class="sum-chip c-warn"><div><div class="val" id="s-warn">0</div><div class="lbl">WARNINGS</div></div></div>
    <div class="sum-chip"><div><div class="val" id="s-total">0</div><div class="lbl">TOTAL</div></div></div>
  </div>

  <!-- Checks: Auth & Repo -->
  <div class="section-hdr"><h2>Авторизация и репозиторий</h2></div>
  <div class="check-grid" id="grid-auth"></div>

  <!-- Checks: Permissions -->
  <div class="section-hdr"><h2>Права доступа</h2></div>
  <div class="check-grid" id="grid-perms"></div>

  <!-- Checks: Workflows -->
  <div class="section-hdr"><h2>Файлы workflow</h2></div>
  <div class="check-grid" id="grid-workflows"></div>

  <!-- Checks: Files -->
  <div class="section-hdr"><h2>Файлы репозитория</h2></div>
  <div class="check-grid" id="grid-files"></div>

  <!-- Recent runs -->
  <div class="section-hdr"><h2>Последние запуски</h2></div>
  <div class="runs-table-wrap" id="runsWrap">
    <div class="empty">Запустите диагностику для загрузки данных</div>
  </div>

  <!-- Log -->
  <div class="section-hdr" style="margin-top:28px"><h2>Лог диагностики</h2></div>
  <div style="display:flex;justify-content:flex-end;margin-bottom:8px">
    <button class="btn btn-ghost" onclick="clearLog()" style="padding:6px 12px;font-size:11px">🗑 Очистить</button>
  </div>
  <div class="log-box" id="log"><span class="log-empty">Лог пуст...</span></div>

</div>

<script>
  const GITHUB_USER = "avatiah";
  const GITHUB_REPO = "ebay-analyzer";
  const API = "https://api.github.com";

  // ── Storage ──────────────────────────────────────────────────────────────
  const store = {
    get: k => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k,v) => { try { localStorage.setItem(k,v); return true; } catch { return false; } }
  };

  // ── Token ────────────────────────────────────────────────────────────────
  function toggleToken() {
    const i = document.getElementById("tokenInput");
    i.type = i.type === "password" ? "text" : "password";
  }
  function saveToken() {
    const v = document.getElementById("tokenInput").value.trim();
    if (!v) { tokenMsg("Введите токен", "err"); return; }
    store.set("GH_TOKEN", v);
    tokenMsg("✓ Сохранён", "ok");
    log("Токен сохранён", "ok");
  }
  function tokenMsg(msg, type) {
    const el = document.getElementById("tokenMsg");
    const colors = { ok: "var(--green)", err: "var(--red)", warn: "var(--yellow)" };
    el.style.color = colors[type] || "var(--text2)";
    el.textContent = msg;
  }
  window.addEventListener("DOMContentLoaded", () => {
    const t = store.get("GH_TOKEN");
    if (t) { document.getElementById("tokenInput").value = t; tokenMsg("✓ Загружен из хранилища", "ok"); }
  });

  // ── Log ──────────────────────────────────────────────────────────────────
  function log(msg, type = "plain") {
    const el = document.getElementById("log");
    const empty = el.querySelector(".log-empty");
    if (empty) empty.remove();
    const lines = el.querySelectorAll(".ll");
    if (lines.length > 300) lines[0].remove();
    const t = new Date().toLocaleTimeString("ru-RU");
    const d = document.createElement("div");
    d.className = "ll";
    d.innerHTML = `<span class="lt">${t}</span><span class="lm ${type}">${esc(msg)}</span>`;
    el.appendChild(d);
    el.scrollTop = el.scrollHeight;
  }
  function clearLog() {
    document.getElementById("log").innerHTML = '<span class="log-empty">Лог очищен.</span>';
  }
  function esc(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  // ── API fetch ────────────────────────────────────────────────────────────
  async function ghFetch(path, opts = {}) {
    const token = store.get("GH_TOKEN");
    const headers = {
      "Accept": "application/vnd.github+json",
      "Content-Type": "application/json",
      ...(token ? { "Authorization": `Bearer ${token}` } : {})
    };
    const res = await fetch(`${API}${path}`, { ...opts, headers });
    const body = await res.json().catch(() => ({}));
    return { status: res.status, ok: res.ok, body };
  }

  // ── Check card rendering ─────────────────────────────────────────────────
  const checks = {}; // id → { state, el }
  const ICONS = { pass:"✅", fail:"❌", warn:"⚠️", info:"ℹ️", idle:"○", running:"⏳" };

  function registerCheck(gridId, id, name, desc) {
    const grid = document.getElementById(gridId);
    const card = document.createElement("div");
    card.className = "check-card idle";
    card.id = "card-" + id;
    card.innerHTML = `
      <div class="check-top">
        <div class="check-name">${esc(name)}</div>
        <div class="check-icon" id="icon-${id}">${ICONS.idle}</div>
      </div>
      <div class="check-desc">${esc(desc)}</div>
      <div class="check-result" id="res-${id}">ожидание...</div>
    `;
    grid.appendChild(card);
    checks[id] = { state: "idle" };
  }

  function setCheck(id, state, message) {
    const card = document.getElementById("card-" + id);
    const res  = document.getElementById("res-" + id);
    const icon = document.getElementById("icon-" + id);
    if (!card) return;
    card.className = `check-card ${state}`;
    res.className  = `check-result ${state}`;
    res.textContent = message;
    icon.textContent = ICONS[state] || "○";
    checks[id].state = state;
  }

  function setRunning(id) { setCheck(id, "running", "проверяем..."); }

  // ── Register all checks ──────────────────────────────────────────────────
  function registerAllChecks() {
    // Auth
    registerCheck("grid-auth", "token_present",  "Токен задан",         "GitHub Personal Access Token сохранён в хранилище");
    registerCheck("grid-auth", "token_valid",    "Токен действителен",  "Проверка через GET /user — токен не истёк и не отозван");
    registerCheck("grid-auth", "repo_exists",    "Репозиторий найден",  `Репозиторий ${GITHUB_USER}/${GITHUB_REPO} существует и доступен`);
    registerCheck("grid-auth", "repo_private",   "Видимость репо",      "Публичный или приватный репозиторий");

    // Permissions
    registerCheck("grid-perms", "scope_repo",    "Scope: repo",         "Токен имеет права на чтение/запись репозитория");
    registerCheck("grid-perms", "scope_workflow", "Scope: workflow",    "Токен имеет право запускать Actions (workflow scope)");
    registerCheck("grid-perms", "actions_write", "Actions: read+write", "Settings → Actions → Workflow permissions: Read and write");
    registerCheck("grid-perms", "push_allowed",  "Push разрешён",       "Токен может пушить в ветку main/master");

    // Workflow files
    registerCheck("grid-workflows", "wf_run_scraper",     "run-scraper.yml",     "Файл .github/workflows/run-scraper.yml существует");
    registerCheck("grid-workflows", "wf_update_keywords", "update-keywords.yml", "Файл .github/workflows/update-keywords.yml существует");
    registerCheck("grid-workflows", "wf_dispatch_events", "Repository dispatch", "Оба workflow настроены на repository_dispatch");

    // Files
    registerCheck("grid-files", "file_main_py",   "main.py",           "Файл main.py существует в корне репозитория");
    registerCheck("grid-files", "file_keywords",  "keywords.txt",      "Файл keywords.txt существует");
    registerCheck("grid-files", "file_data_dir",  "data/",             "Папка data/ существует в репозитории");
    registerCheck("grid-files", "file_csv",        "data/raw_data.csv", "CSV-файл с результатами существует");
  }

  // ── Run diagnostics ──────────────────────────────────────────────────────
  async function runAll() {
    const btn = document.getElementById("runAllBtn");
    const sp  = document.getElementById("mainSpinner");
    btn.disabled = true; sp.style.display = "inline-block";
    document.getElementById("globalStatus").textContent = "диагностика...";
    document.getElementById("summary").style.display = "none";
    log("=== Запуск диагностики ===", "info");

    // Reset all
    Object.keys(checks).forEach(id => setCheck(id, "idle", "ожидание..."));

    try {
      await checkToken();
      await checkRepo();
      await checkWorkflowFiles();
      await checkRepoFiles();
      await loadRecentRuns();
    } catch(e) {
      log("Критическая ошибка: " + e.message, "err");
    }

    updateSummary();
    btn.disabled = false; sp.style.display = "none";
    log("=== Диагностика завершена ===", "info");
    document.getElementById("globalStatus").textContent = "готово";
  }

  // ── Check: Token ─────────────────────────────────────────────────────────
  async function checkToken() {
    setRunning("token_present");
    setRunning("token_valid");

    const token = store.get("GH_TOKEN");
    if (!token) {
      setCheck("token_present", "fail", "Токен не найден — введите и сохраните токен выше");
      setCheck("token_valid",   "fail", "Невозможно проверить без токена");
      setCheck("scope_repo",    "fail", "Невозможно проверить без токена");
      setCheck("scope_workflow","fail", "Невозможно проверить без токена");
      log("Токен отсутствует", "err");
      return;
    }
    setCheck("token_present", "pass", `Токен найден: ${token.slice(0,8)}...`);
    log("Токен найден", "ok");

    // Validate token via /user
    const { status, ok, body, headers: h } = await ghFetchWithHeaders("/user");
    if (!ok) {
      const msg = status === 401 ? "Токен недействителен (401 Unauthorized)"
                : status === 403 ? "Токен заблокирован (403 Forbidden)"
                : `HTTP ${status}`;
      setCheck("token_valid", "fail", msg);
      log("Токен недействителен: " + msg, "err");
      setCheck("scope_repo",    "fail", "Токен недействителен");
      setCheck("scope_workflow","fail", "Токен недействителен");
      return;
    }
    setCheck("token_valid", "pass", `Авторизован как: ${body.login || "?"}`);
    log(`Авторизован как ${body.login}`, "ok");

    // Check scopes from headers
    const scopes = (h["x-oauth-scopes"] || "").split(",").map(s => s.trim());
    log(`Scopes: ${scopes.join(", ") || "(нет)"}`, "plain");

    const hasRepo = scopes.includes("repo") || scopes.includes("public_repo");
    setCheck("scope_repo", hasRepo ? "pass" : "warn",
      hasRepo ? `Scope 'repo' присутствует`
              : `Scope 'repo' не найден. Есть: ${scopes.join(", ") || "нет"}\nПересоздайте токен с правами repo + workflow`);

    const hasWF = scopes.includes("workflow") || scopes.includes("repo");
    setCheck("scope_workflow", hasWF ? "pass" : "fail",
      hasWF ? `Scope 'workflow' или 'repo' присутствует`
            : `Scope 'workflow' отсутствует!\nПересоздайте токен с галочкой 'workflow'`);

    if (!hasWF) log("КРИТИЧНО: scope 'workflow' отсутствует — dispatch не будет работать", "err");
  }

  // ── ghFetch with header access ────────────────────────────────────────────
  async function ghFetchWithHeaders(path, opts = {}) {
    const token = store.get("GH_TOKEN");
    const headers = {
      "Accept": "application/vnd.github+json",
      "Content-Type": "application/json",
      ...(token ? { "Authorization": `Bearer ${token}` } : {})
    };
    const res = await fetch(`${API}${path}`, { ...opts, headers });
    const resHeaders = {};
    res.headers.forEach((v, k) => { resHeaders[k.toLowerCase()] = v; });
    const body = await res.json().catch(() => ({}));
    return { status: res.status, ok: res.ok, body, headers: resHeaders };
  }

  // ── Check: Repo ──────────────────────────────────────────────────────────
  async function checkRepo() {
    setRunning("repo_exists"); setRunning("repo_private");
    setRunning("actions_write"); setRunning("push_allowed");

    const { status, ok, body } = await ghFetch(`/repos/${GITHUB_USER}/${GITHUB_REPO}`);

    if (!ok) {
      const msg = status === 404 ? `Репозиторий ${GITHUB_USER}/${GITHUB_REPO} не найден (404)\nПроверьте имя репо или права токена`
                : status === 401 ? "Нет доступа (401) — недействительный токен"
                : `HTTP ${status}`;
      setCheck("repo_exists",   "fail", msg);
      setCheck("repo_private",  "fail", "Репозиторий недоступен");
      setCheck("actions_write", "fail", "Репозиторий недоступен");
      setCheck("push_allowed",  "fail", "Репозиторий недоступен");
      log("Репозиторий недоступен: " + msg, "err");
      return;
    }

    setCheck("repo_exists", "pass", `Найден: ${body.full_name}\nDefault branch: ${body.default_branch}`);
    log(`Репозиторий найден: ${body.full_name}`, "ok");

    setCheck("repo_private", "info",
      body.private ? "Приватный репозиторий (private)" : "Публичный репозиторий (public)");

    // Check push permission
    const perms = body.permissions || {};
    const canPush = perms.push || perms.admin;
    setCheck("push_allowed", canPush ? "pass" : "fail",
      canPush ? "Push разрешён (permissions.push = true)"
              : "Push ЗАПРЕЩЁН! Токен не имеет права на запись\nДобавьте права 'repo' при создании токена");
    if (!canPush) log("КРИТИЧНО: push запрещён для данного токена", "err");

    // Actions write — check via settings (may 403)
    await checkActionsPermissions(body.default_branch);
  }

  async function checkActionsPermissions(branch) {
    setRunning("actions_write");
    const { status, ok, body } = await ghFetch(
      `/repos/${GITHUB_USER}/${GITHUB_REPO}/actions/permissions`
    );
    if (status === 403) {
      setCheck("actions_write", "warn",
        "Не удалось проверить автоматически (403)\nПроверьте вручную:\nSettings → Actions → General → Workflow permissions\n→ выбрать 'Read and write permissions'");
      log("Права Actions: нет доступа к настройкам (403) — проверьте вручную", "warn");
      return;
    }
    if (!ok) {
      setCheck("actions_write", "warn", `HTTP ${status} при проверке Actions permissions`);
      return;
    }
    const enabled = body.enabled !== false;
    setCheck("actions_write", enabled ? "pass" : "fail",
      enabled ? `Actions включены. Default: ${body.default_workflow_permissions || "?"}`
              : "Actions ОТКЛЮЧЕНЫ для этого репозитория!\nSettings → Actions → General → Allow all actions");
    log(`Actions enabled: ${enabled}, default perms: ${body.default_workflow_permissions}`, enabled ? "ok" : "err");
  }

  // ── Check: Workflow files ─────────────────────────────────────────────────
  async function checkWorkflowFiles() {
    setRunning("wf_run_scraper"); setRunning("wf_update_keywords"); setRunning("wf_dispatch_events");

    // List workflows
    const { ok, body } = await ghFetch(
      `/repos/${GITHUB_USER}/${GITHUB_REPO}/actions/workflows`
    );

    if (!ok) {
      setCheck("wf_run_scraper",     "fail", "Не удалось получить список workflows");
      setCheck("wf_update_keywords", "fail", "Не удалось получить список workflows");
      setCheck("wf_dispatch_events", "fail", "Не удалось получить список workflows");
      return;
    }

    const wfs = body.workflows || [];
    log(`Найдено workflows: ${wfs.length}`, "plain");

    const scraperWF = wfs.find(w => w.path.includes("run-scraper"));
    const keywordsWF = wfs.find(w => w.path.includes("update-keywords"));

    setCheck("wf_run_scraper", scraperWF ? "pass" : "fail",
      scraperWF
        ? `Найден: ${scraperWF.path}\nСтатус: ${scraperWF.state}`
        : "Файл run-scraper.yml НЕ НАЙДЕН в .github/workflows/\nСоздайте файл и закоммитьте его");

    setCheck("wf_update_keywords", keywordsWF ? "pass" : "fail",
      keywordsWF
        ? `Найден: ${keywordsWF.path}\nСтатус: ${keywordsWF.state}`
        : "Файл update-keywords.yml НЕ НАЙДЕН в .github/workflows/\nСоздайте файл и закоммитьте его");

    // Check dispatch trigger via file content
    let dispatchOk = true;
    const notes = [];
    for (const [wfObj, name] of [[scraperWF, "run-scraper"], [keywordsWF, "update-keywords"]]) {
      if (!wfObj) { dispatchOk = false; notes.push(`${name}: файл не найден`); continue; }
      const { ok: fok, body: fb } = await ghFetch(
        `/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${wfObj.path}`
      );
      if (fok && fb.content) {
        const content = atob(fb.content.replace(/\n/g, ""));
        if (!content.includes("repository_dispatch")) {
          dispatchOk = false;
          notes.push(`${name}: триггер repository_dispatch НЕ НАЙДЕН`);
        } else {
          notes.push(`${name}: ✓ repository_dispatch найден`);
        }
      }
    }
    setCheck("wf_dispatch_events", dispatchOk ? "pass" : "fail", notes.join("\n"));
  }

  // ── Check: Files ──────────────────────────────────────────────────────────
  async function checkRepoFiles() {
    const filesToCheck = [
      ["file_main_py",  "main.py"],
      ["file_keywords", "keywords.txt"],
      ["file_data_dir", "data"],
      ["file_csv",      "data/raw_data.csv"],
    ];

    for (const [id, path] of filesToCheck) {
      setRunning(id);
      const { status, ok, body } = await ghFetch(
        `/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`
      );
      if (ok) {
        const size = body.size ? ` (${(body.size/1024).toFixed(1)} KB)` : "";
        const isDir = body.type === "dir" || Array.isArray(body);
        setCheck(id, "pass", isDir ? "Папка существует" : `Файл найден${size}`);
        log(`${path}: найден`, "ok");
      } else if (status === 404) {
        const hint = path === "main.py" ? "\nСоздайте main.py — основной скрипт скрапера"
          : path === "data/raw_data.csv" ? "\nCSV создаётся при первом успешном запуске скрапера"
          : path === "data" ? "\nПапка создаётся скриптом (mkdir -p data)"
          : "";
        setCheck(id, path === "data/raw_data.csv" || path === "data" ? "warn" : "fail",
          `Не найден (404)${hint}`);
        log(`${path}: не найден`, path === "data/raw_data.csv" ? "warn" : "err");
      } else {
        setCheck(id, "warn", `HTTP ${status}`);
      }
    }
  }

  // ── Recent runs ───────────────────────────────────────────────────────────
  async function loadRecentRuns() {
    log("Загрузка последних запусков...", "plain");
    const { ok, body } = await ghFetch(
      `/repos/${GITHUB_USER}/${GITHUB_REPO}/actions/runs?per_page=20`
    );
    const wrap = document.getElementById("runsWrap");

    if (!ok || !body.workflow_runs?.length) {
      wrap.innerHTML = '<div class="empty">Запуски не найдены или нет доступа</div>';
      return;
    }

    const runs = body.workflow_runs;
    log(`Получено ${runs.length} запусков`, "ok");

    const rows = runs.map(r => {
      const date = new Date(r.created_at).toLocaleString("ru-RU");
      const dur  = r.updated_at
        ? Math.round((new Date(r.updated_at) - new Date(r.created_at)) / 1000) + "s"
        : "—";
      const conclusion = r.conclusion || r.status || "unknown";
      return `<tr>
        <td><a class="run-link" href="${r.html_url}" target="_blank">#${r.run_number}</a></td>
        <td>${esc(r.name)}</td>
        <td><span class="run-status ${conclusion}">${conclusion}</span></td>
        <td>${esc(r.event)}</td>
        <td>${date}</td>
        <td>${dur}</td>
        <td>${esc(r.head_branch)}</td>
      </tr>`;
    }).join("");

    wrap.innerHTML = `<table>
      <thead><tr>
        <th>#</th><th>Workflow</th><th>Статус</th><th>Событие</th>
        <th>Время</th><th>Длит.</th><th>Ветка</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;

    // Count failures for diagnosis
    const failures = runs.filter(r => r.conclusion === "failure");
    if (failures.length) {
      log(`Обнаружено ${failures.length} упавших запусков из ${runs.length}`, "warn");
      failures.slice(0, 3).forEach(r => {
        log(`  ↳ #${r.run_number} ${r.name} — см. ${r.html_url}`, "err");
      });
    }
  }

  // ── Summary ───────────────────────────────────────────────────────────────
  function updateSummary() {
    const states = Object.values(checks).map(c => c.state);
    const pass  = states.filter(s => s === "pass").length;
    const fail  = states.filter(s => s === "fail").length;
    const warn  = states.filter(s => s === "warn").length;
    const total = states.filter(s => s !== "idle" && s !== "running").length;

    document.getElementById("s-pass").textContent  = pass;
    document.getElementById("s-fail").textContent  = fail;
    document.getElementById("s-warn").textContent  = warn;
    document.getElementById("s-total").textContent = total;
    document.getElementById("summary").style.display = "flex";

    const status = fail > 0 ? `❌ ${fail} ошибок` : warn > 0 ? `⚠️ ${warn} предупреждений` : "✅ Всё в порядке";
    document.getElementById("globalStatus").textContent = status;
    log(`Итог: ${pass} OK / ${fail} fail / ${warn} warn`, fail > 0 ? "err" : warn > 0 ? "warn" : "ok");
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  registerAllChecks();
</script>
