name: Run Scraper

on:
  repository_dispatch:
    types: [run-scraper]

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper
        env:
          KEYWORD: ${{ github.event.client_payload.keyword }}
        run: |
          mkdir -p data
          echo "$KEYWORD" > keywords.txt
          python main.py
          test -f data/raw_data.csv || (echo "CSV не создан" && exit 1)

      - name: Commit CSV results
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add data/raw_data.csv keywords.txt
          git diff --staged --quiet || git commit -m "Scraper results: ${{ github.event.client_payload.keyword }}"
          git pull --rebase origin main
          git push origin main
