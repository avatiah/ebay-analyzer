<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>eBay Analyzer – загрузка CSV вручную</title>
    <style>
        /* (стили такие же, как в предыдущей светлой версии – для краткости опускаю, но в финальном файле они полные) */
        body { font-family: sans-serif; background: #f8fafc; padding: 20px; }
        .container { max-width: 1400px; margin: auto; }
        .topbar { background: white; padding: 15px; border-radius: 16px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        button, .btn { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 10px; cursor: pointer; }
        .btn-ghost { background: #e2e8f0; color: #1e293b; }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 12px; margin-bottom: 20px; }
        .kpi { background: white; border-radius: 16px; padding: 16px; border: 1px solid #e2e8f0; }
        .kpi-val { font-size: 24px; font-weight: bold; }
        .tbl-wrap { overflow-x: auto; background: white; border-radius: 16px; padding: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .tab { display: inline-block; padding: 8px 16px; cursor: pointer; background: #e2e8f0; border-radius: 20px; margin-right: 8px; }
        .tab.active { background: #2563eb; color: white; }
        .section { display: none; }
        .section.active { display: block; }
    </style>
</head>
<body>
<div class="container">
    <div class="topbar">
        <div style="font-weight: bold; font-size: 20px;">📊 eBay POD Analyzer</div>
        <input type="file" id="csvFileInput" accept=".csv" style="flex:1">
        <button id="loadCsvBtn">📁 Загрузить CSV</button>
        <button id="exportExcelBtn" class="btn-ghost">📎 Экспорт CSV</button>
        <span id="status"></span>
    </div>
    <div id="tabs" style="margin-bottom: 20px;">
        <span class="tab active" data-tab="niche">🎯 Ниши</span>
        <span class="tab" data-tab="overview">📊 Обзор</span>
        <span class="tab" data-tab="products">📦 Товары</span>
        <span class="tab" data-tab="sellers">👤 Продавцы</span>
    </div>
    <div id="niche" class="section active">
        <div class="kpi-grid" id="nicheKpi"></div>
        <div id="nicheContent">Загрузите CSV для анализа</div>
    </div>
    <div id="overview" class="section"><div class="kpi-grid" id="overviewKpi"></div><div id="overviewContent"></div></div>
    <div id="products" class="section"><div class="tbl-wrap"><table id="productsTable"><thead><tr><th>Товар</th><th>Цена</th><th>Продавец</th><th>Ссылка</th></tr></thead><tbody></tbody></table></div></div>
    <div id="sellers" class="section"><div class="tbl-wrap"><table id="sellersTable"><thead><tr><th>Продавец</th><th>Товаров</th><th>Ср. цена</th><th>Профиль</th></tr></thead><tbody></tbody></table></div></div>
</div>
<script>
    let currentData = [];

    document.getElementById("loadCsvBtn").addEventListener("click", function() {
        const file = document.getElementById("csvFileInput").files[0];
        if (!file) { alert("Выберите CSV файл"); return; }
        const reader = new FileReader();
        reader.onload = function(e) {
            const text = e.target.result;
            parseCSV(text);
            renderAll();
            document.getElementById("status").innerHTML = `✅ Загружено ${currentData.length} товаров`;
        };
        reader.readAsText(file, "UTF-8");
    });

    function parseCSV(csvText) {
        const lines = csvText.split(/\r?\n/).filter(l => l.trim());
        if (lines.length < 2) return;
        const headers = lines[0].split(",").map(h => h.trim().replace(/^"|"$/g, ''));
        const dataRows = [];
        for (let i = 1; i < lines.length; i++) {
            const values = [];
            let inQuote = false;
            let current = "";
            for (let ch of lines[i]) {
                if (ch === '"') { inQuote = !inQuote; }
                else if (ch === "," && !inQuote) { values.push(current); current = ""; }
                else { current += ch; }
            }
            values.push(current);
            const row = {};
            headers.forEach((h, idx) => { row[h] = values[idx] ? values[idx].replace(/^"|"$/g, '').trim() : ""; });
            dataRows.push(row);
        }
        // Нормализуем колонки: ищем title, price, seller, url
        const titleKey = headers.find(h => /title|name|product/i.test(h)) || "title";
        const priceKey = headers.find(h => /price|current_price|selling/i.test(h)) || "price";
        const sellerKey = headers.find(h => /seller|vendor|store|username/i.test(h)) || "seller";
        const urlKey = headers.find(h => /url|link/i.test(h)) || "url";
        currentData = dataRows.map(row => ({
            title: row[titleKey] || "",
            price: parseFloat(row[priceKey]) || 0,
            seller: row[sellerKey] || "",
            url: row[urlKey] || ""
        })).filter(item => item.title && item.price > 0);
    }

    function renderAll() {
        if (!currentData.length) return;
        renderNiche();
        renderOverview();
        renderProducts();
        renderSellers();
    }

    function renderNiche() {
        const prices = currentData.map(d => d.price).sort((a,b)=>a-b);
        const avg = prices.reduce((a,b)=>a+b,0)/prices.length;
        const sellers = [...new Set(currentData.map(d=>d.seller))];
        const freeCount = 0; // нет данных о доставке – заглушка
        const nicheKpi = document.getElementById("nicheKpi");
        nicheKpi.innerHTML = `
            <div class="kpi"><div class="kpi-val">${currentData.length}</div><div class="kpi-lbl">Товаров</div></div>
            <div class="kpi"><div class="kpi-val">${f$(avg)}</div><div class="kpi-lbl">Ср. цена</div></div>
            <div class="kpi"><div class="kpi-val">${sellers.length}</div><div class="kpi-lbl">Продавцов</div></div>
            <div class="kpi"><div class="kpi-val">${f$(avg * currentData.length,0)}</div><div class="kpi-lbl">Оценка рынка</div></div>
        `;
        document.getElementById("nicheContent").innerHTML = `<p>📈 Opportunity Score (пример): ${Math.min(100, Math.round(100 - sellers.length/2))}/100</p>`;
    }

    function renderOverview() {
        const prices = currentData.map(d => d.price).sort((a,b)=>a-b);
        const avg = prices.reduce((a,b)=>a+b,0)/prices.length;
        const med = prices[Math.floor(prices.length/2)] || 0;
        const overviewKpi = document.getElementById("overviewKpi");
        overviewKpi.innerHTML = `
            <div class="kpi"><div class="kpi-val">${currentData.length}</div><div class="kpi-lbl">Товаров</div></div>
            <div class="kpi"><div class="kpi-val">${f$(avg)}</div><div class="kpi-lbl">Ср. цена</div></div>
            <div class="kpi"><div class="kpi-val">${f$(med)}</div><div class="kpi-lbl">Медиана</div></div>
            <div class="kpi"><div class="kpi-val">${f$(prices[0]||0)}</div><div class="kpi-lbl">Мин</div></div>
            <div class="kpi"><div class="kpi-val">${f$(prices[prices.length-1]||0)}</div><div class="kpi-lbl">Макс</div></div>
        `;
        document.getElementById("overviewContent").innerHTML = `<p>Гистограмма цен (упрощённо): минимальная ${f$(prices[0])}, максимальная ${f$(prices[prices.length-1])}</p>`;
    }

    function renderProducts() {
        const tbody = document.querySelector("#productsTable tbody");
        tbody.innerHTML = currentData.map(item => `
            <tr>
                <td>${escapeHtml(item.title)}</td>
                <td>${f$(item.price)}</td>
                <td><a href="https://www.ebay.com/usr/${encodeURIComponent(item.seller)}" target="_blank">${escapeHtml(item.seller)} ↗</a></td>
                <td><a href="${escapeHtml(item.url)}" target="_blank">→</a></td>
            </tr>
        `).join("");
    }

    function renderSellers() {
        const sellerMap = new Map();
        currentData.forEach(item => {
            sellerMap.set(item.seller, (sellerMap.get(item.seller) || 0) + 1);
        });
        const tbody = document.querySelector("#sellersTable tbody");
        tbody.innerHTML = Array.from(sellerMap.entries()).map(([seller, count]) => {
            const avgPrice = currentData.filter(i => i.seller === seller).reduce((s,i)=>s+i.price,0)/count;
            return `<tr>
                <td><a href="https://www.ebay.com/usr/${encodeURIComponent(seller)}" target="_blank">${escapeHtml(seller)} ↗</a></td>
                <td>${count}</td>
                <td>${f$(avgPrice)}</td>
                <td><a href="https://www.ebay.com/usr/${encodeURIComponent(seller)}" target="_blank">профиль</a></td>
            </tr>`;
        }).join("");
    }

    function f$(v, d=2) { return v>0 ? "$"+v.toFixed(d) : "—"; }
    function escapeHtml(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

    // Переключение вкладок
    document.querySelectorAll(".tab").forEach(tab => {
        tab.addEventListener("click", () => {
            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            tab.classList.add("active");
            const sectionId = tab.getAttribute("data-tab");
            document.querySelectorAll(".section").forEach(sec => sec.classList.remove("active"));
            document.getElementById(sectionId).classList.add("active");
        });
    });

    document.getElementById("exportExcelBtn").addEventListener("click", () => {
        if (!currentData.length) return;
        const csvRows = [["title","price","seller","url"]];
        currentData.forEach(item => {
            csvRows.push([`"${item.title.replace(/"/g,'""')}"`, item.price, `"${item.seller.replace(/"/g,'""')}"`, `"${item.url.replace(/"/g,'""')}"`]);
        });
        const blob = new Blob(["\uFEFF" + csvRows.map(r=>r.join(",")).join("\n")], {type:"text/csv"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "ebay_export.csv";
        a.click();
        URL.revokeObjectURL(a.href);
    });
</script>
</body>
</html>
